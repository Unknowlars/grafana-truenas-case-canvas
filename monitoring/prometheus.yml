# Prometheus: scrape the fan-gui /metrics endpoint and load the alert rules.
#
# Put the GUI password (just the password, no newline needed) in a file Prometheus can read, e.g.
#   printf '%s' 'YOUR_FAN_GUI_PASSWORD' > /etc/prometheus/secrets/fan-gui.pass && chmod 600 ...
# Merge the scrape job below into your existing prometheus.yml if you already run one.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: fan-gui
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    basic_auth:
      username: admin                       # FAN_GUI_USER
      password_file: /etc/prometheus/secrets/fan-gui.pass
    static_configs:
      - targets: ["YOUR_SERVER_IP:18765"]    # the machine running fan-gui : PORT
        labels:
          host: truenas
