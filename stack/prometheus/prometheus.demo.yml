# Prometheus config for the demo stack: scrapes the synthetic demo exporter once a second so the animation is smooth.
global:
  scrape_interval: 1s
  evaluation_interval: 15s

scrape_configs:
  - job_name: fan-gui
    metrics_path: /fan-gui/metrics
    static_configs:
      - targets: ["demo-exporter:9000"]

  - job_name: node
    metrics_path: /node/metrics
    static_configs:
      - targets: ["demo-exporter:9000"]
